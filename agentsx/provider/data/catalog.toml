# AgentsX provider catalog.
# Generated from project profiles and community providers.
# User overrides: ~/.agentsx/catalog.toml (merged on top of this file).

schema_version = 1

# ── OpenAI ─────────────────────────────────────────────────────────────
[[providers]]
name = "openai"
display_name = "OpenAI"
base_url = "https://api.openai.com/v1"
api_format = "openai"
env_api_key = "AGENTSX_OPENAI_API_KEY"
env_api_base = "AGENTSX_OPENAI_API_BASE"
default_model = "gpt-4o"
context_window = 128_000
supports_vision = true
model_prefix = "gpt-"

[providers.models]
"gpt-4o" = { context_window = 128_000 }
"gpt-4o-mini" = { context_window = 128_000 }
"o1" = { context_window = 200_000 }
"o3-mini" = { context_window = 200_000 }

# ── Anthropic ──────────────────────────────────────────────────────────
[[providers]]
name = "anthropic"
display_name = "Anthropic"
base_url = "https://api.anthropic.com/v1"
api_format = "anthropic"
env_api_key = "AGENTSX_ANTHROPIC_API_KEY"
env_api_base = "AGENTSX_ANTHROPIC_API_BASE"
default_model = "claude-sonnet-4-20250514"
context_window = 200_000
supports_vision = true
model_prefix = "claude-"
extra_headers = { anthropic-version = "2023-06-01" }

[providers.models]
"claude-sonnet-4-20250514" = { context_window = 200_000 }
"claude-opus-4-20250414" = { context_window = 200_000 }
"claude-haiku-4-20251001" = { context_window = 200_000 }

